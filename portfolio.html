<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio & Kepuasan Pelanggan</title><style>body{font:16px Arial;margin:0;background:#f6f7f8;color:#17191d}header{background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between}main{max-width:950px;margin:auto;padding:16px}.hero,.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:14px}.hero{background:#191b20;color:white}h1{font-size:clamp(30px,5vw,46px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:7px;font:inherit}textarea{min-height:100px}.stars button,button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}.red{background:#e50914;color:white}.on{background:#ffe7a3}.muted{color:#68707b;font-size:13px;line-height:1.5}.review{border:1px solid #ddd;border-radius:9px;padding:12px;margin-top:10px}.check{display:flex;gap:8px;margin:12px 0;font-size:13px}.check input{width:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>SAUJANA SEJATI ENT</b><a href="./index.html" style="color:#111;background:#fff;padding:10px;border-radius:7px;text-decoration:none">← Laman utama</a></header><main><section class="hero"><h1>Portfolio & Kepuasan Pelanggan</h1><p>Kongsikan pengalaman anda. Semua orang boleh menghantar ulasan; ulasan akan disemak sebelum diterbitkan.</p></section><div class="grid"><section class="panel"><h2>Ulasan pelanggan</h2><p class="muted">Ulasan diluluskan akan dipaparkan di sini.</p><div id="reviews">Memuatkan ulasan…</div></section><section class="panel"><h2>Kongsi pengalaman anda</h2><form id="form"><div class="field"><label>Nama paparan *</label><input id="name" maxlength="80" required></div><div class="field"><label>Jenis projek *</label><select id="project" required><option value="">Pilih projek</option><option>Kabinet Dapur</option><option>Almari Bilik</option><option>Rak TV</option><option>Rak Bawah Tangga</option><option>Bar Kaunter</option><option>Lain-lain</option></select></div><div class="field"><label>Penilaian *</label><div id="stars" class="stars"><button type="button" data-n="1">★</button><button type="button" data-n="2">★</button><button type="button" data-n="3">★</button><button type="button" data-n="4">★</button><button type="button" data-n="5">★</button></div></div><div class="field"><label>Komen / pengalaman *</label><textarea id="comment" maxlength="1500" required></textarea></div><div class="field"><label>Pautan gambar projek (pilihan)</label><input id="photo" type="url" placeholder="https://…"></div><label class="check"><input id="promo" type="checkbox">Saya memberi izin ulasan/gambar ini digunakan untuk portfolio dan promosi. Persetujuan ini sukarela.</label><label class="check"><input id="confirm" type="checkbox" required>Saya mengesahkan ulasan ini benar dan bersetuju ia disemak sebelum diterbitkan.</label><button class="red" id="send" type="submit">Hantar ulasan</button><div id="notice"></div></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://wvxaiojnxwzcdrczbdup.supabase.co","sb_publishable_F_JX1g6axQQBZUJTVRCqUA_fEc5YsA2");let rating=0;const stars=[...document.querySelectorAll("#stars button")];stars.forEach(b=>b.onclick=()=>{rating=Number(b.dataset.n);stars.forEach(s=>s.classList.toggle("on",Number(s.dataset.n)<=rating))});function safe(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const box=document.getElementById("reviews");try{const r=await db.from("customer_reviews").select("customer_name,project_type,rating,comment,project_photo_url,created_at").eq("status","approved").order("created_at",{ascending:false}).limit(60);if(r.error)throw r.error;const rows=r.data||[];box.innerHTML=rows.length?rows.map(x=>'<div class="review"><b>'+safe(x.customer_name)+'</b><div style="color:#c90">'+("★".repeat(Number(x.rating)))+'</div><span class="muted">'+safe(x.project_type)+'</span><p>'+safe(x.comment)+'</p>'+(x.project_photo_url?'<img style="max-width:100%" src="'+safe(x.project_photo_url)+'" alt="Gambar projek">':'')+'</div>').join(""):'<p class="muted">Belum ada ulasan diterbitkan.</p>'}catch(e){box.innerHTML='<p class="muted">Ulasan belum tersedia. Jalankan fail SQL persediaan dalam Supabase dahulu.</p>';console.error(e)}}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!rating){document.getElementById("notice").textContent="Sila pilih bintang.";return}const btn=document.getElementById("send");btn.disabled=true;try{const r=await db.from("customer_reviews").insert({customer_name:document.getElementById("name").value.trim(),project_type:document.getElementById("project").value,rating,comment:document.getElementById("comment").value.trim(),project_photo_url:document.getElementById("photo").value.trim()||null,marketing_consent:document.getElementById("promo").checked});if(r.error)throw r.error;document.getElementById("notice").textContent="Terima kasih! Ulasan dihantar dan menunggu semakan.";e.target.reset();rating=0;stars.forEach(s=>s.classList.remove("on"))}catch(err){document.getElementById("notice").textContent="Gagal hantar. Pastikan SQL persediaan sudah dijalankan.";console.error(err)}finally{btn.disabled=false}};load();
</script></body></html>
