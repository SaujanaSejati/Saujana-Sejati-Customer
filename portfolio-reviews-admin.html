<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semakan Ulasan — Saujana Sejati Ent</title><style>body{font:16px Arial;margin:0;background:#f5f6f7;color:#191b20}header{background:#111;color:white;padding:16px}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}.muted{color:#68707b;font-size:13px;line-height:1.5}.review{border:1px solid #ddd;border-radius:9px;padding:14px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.ok{background:#087f45;color:#fff}.no{background:#b4232b;color:#fff}button,a{border:0;border-radius:7px;padding:10px 13px;font-weight:bold;cursor:pointer;text-decoration:none}.back{background:#eee;color:#111}.status{font-weight:bold}</style></head><body><header><b>SAUJANA SEJATI ENT — SEMAKAN ULASAN</b></header><main><div class="card"><h2>Portfolio & Kepuasan Pelanggan</h2><p class="muted">Halaman ini untuk Admin sahaja. Log masuk melalui sistem Admin utama dahulu menggunakan akaun owner/manager, kemudian buka halaman ini dalam pelayar yang sama.</p><a class="back" href="./index.html">← Kembali</a> <button onclick="load()" class="back">Muat semula</button><div id="status" class="status">Menyemak sesi Admin…</div></div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://wvxaiojnxwzcdrczbdup.supabase.co","sb_publishable_F_JX1g6axQQBZUJTVRCqUA_fEc5YsA2");
const statusEl=document.getElementById("status"),list=document.getElementById("list");
function safe(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;',"'":"&#39;"}[c]))}
async function checkAdmin(){const s=await db.auth.getSession();const user=s.data?.session?.user;if(!user){statusEl.textContent="Tiada sesi. Log masuk ke sistem Admin utama dahulu.";return false}const p=await db.from("admin_profiles").select("name,role,active").eq("id",user.id).maybeSingle();if(p.error||!p.data||p.data.active!==true||!["owner","manager"].includes(p.data.role)){statusEl.textContent="Akses ditolak. Akaun owner/manager aktif diperlukan.";return false}statusEl.textContent="Log masuk sebagai "+(p.data.name||user.email)+" · "+p.data.role;return true}
async function act(id,newStatus){if(!(await checkAdmin()))return;const r=await db.from("customer_reviews").update({status:newStatus}).eq("id",id);if(r.error){alert("Gagal kemas kini: "+r.error.message);return}await load()}
async function load(){list.innerHTML="Memuatkan ulasan…";if(!(await checkAdmin())){list.innerHTML="";return}const r=await db.from("customer_reviews").select("id,customer_name,project_type,rating,comment,project_photo_url,marketing_consent,status,created_at").order("created_at",{ascending:false}).limit(100);if(r.error){list.textContent="Tidak dapat membaca ulasan. Jalankan fail PORTFOLIO-REVIEWS-SETUP.sql terkini di Supabase. "+r.error.message;return}const rows=r.data||[];if(!rows.length){list.innerHTML='<div class="card">Belum ada ulasan.</div>';return}list.innerHTML=rows.map(x=>'<article class="review"><div class="status">Status: '+safe(x.status)+' · '+("★".repeat(Number(x.rating)))+'</div><h3>'+safe(x.customer_name)+' — '+safe(x.project_type)+'</h3><p>'+safe(x.comment)+'</p>'+(x.project_photo_url?'<p><a href="'+safe(x.project_photo_url)+'" target="_blank" rel="noopener">Buka gambar</a></p>':'')+'<p class="muted">Izin promosi: '+(x.marketing_consent?'Ya':'Tidak')+' · '+safe(x.created_at)+'</p><div class="actions"><button class="ok" onclick="act('+Number(x.id)+',\'approved\')">Luluskan</button><button class="no" onclick="act('+Number(x.id)+',\'rejected\')">Tolak</button><button class="back" onclick="act('+Number(x.id)+',\'pending\')">Jadikan pending</button></div></article>').join("")}
load();
</script></body></html>
