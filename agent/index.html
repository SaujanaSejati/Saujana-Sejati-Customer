<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Saujana Sejati Ent — Agent</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;font-family:Arial,sans-serif}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;z-index:0}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:1}
</style>
</head>
<body>
<div id="status">Membuka panel agent Saujana Sejati Ent…</div>
<iframe title="Panel Agent Saujana Sejati Ent" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  const parts=location.pathname.split('/').filter(Boolean);
  const at=parts.findIndex(p=>p.toLowerCase()==='agent');
  const pathSlug=at>=0?decodeURIComponent(parts[at+1]||''):'';
  const querySlug=new URLSearchParams(location.search).get('agent')||'';
  const slug=(pathSlug||querySlug).toLowerCase().trim();
  if(!slug){
    document.getElementById('status').textContent='Pautan agent tidak lengkap. Gunakan /agent/nama-agent';
    return;
  }
  const target='https://saujanasejati.github.io/Saujana-Sejati-Customer/?agent='+encodeURIComponent(slug);
  const frame=document.querySelector('iframe');
  frame.src=target;
  frame.addEventListener('load',()=>{document.getElementById('status').style.display='none';});
})();
</script>
</body>
</html>
