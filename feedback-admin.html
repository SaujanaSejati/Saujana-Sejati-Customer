<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maklum Balas Website — Admin | Saujana Sejati Ent</title><style>body{font:15px Arial;margin:0;background:#f5f6f7;color:#17191c}header{background:#111;color:#fff;padding:16px}main{max-width:1000px;margin:auto;padding:16px}.card,.feedback{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.feedback{border-radius:12px}.stars{font-size:20px}.muted{color:#68707b;font-size:13px;line-height:1.5}.reply{background:#f7f7f7;border-left:4px solid #e50914;padding:12px;border-radius:8px;margin-top:12px}.reply textarea{width:100%;box-sizing:border-box;min-height:90px;border:1px solid #bbb;border-radius:9px;padding:11px;font:15px Arial;margin-top:8px}.actions{margin-top:9px}button,a{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer;text-decoration:none}.send{background:#e50914;color:#fff}.back{background:#eee;color:#111}.status{font-weight:bold;margin-top:8px}.empty{text-align:center;padding:25px;color:#68707b}</style></head><body><header><b>SAUJANA SEJATI ENT — MAKLUM BALAS WEBSITE</b></header><main><div class="card"><h2>💬 Maklum Balas Pengguna</h2><p class="muted">Semak maklum balas website dan balas pelanggan/pengunjung. Ini berasingan daripada maklum balas booking kabinet.</p><a class="back" href="./index.html">← Kembali</a> <button class="back" onclick="load()">Muat semula</button><div id="status" class="status">Menyemak sesi Admin…</div></div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://wvxaiojnxwzcdrczbdup.supabase.co","sb_publishable_F_JX1g6axQQBZUJTVRCqUA_fEc5YsA2"),statusEl=document.getElementById("status"),list=document.getElementById("list");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function checkAdmin(){const s=await db.auth.getSession(),user=s.data?.session?.user;if(!user){statusEl.textContent="Tiada sesi. Log masuk ke sistem Admin utama dahulu.";return null}const p=await db.from("admin_profiles").select("name,role,active").eq("id",user.id).maybeSingle();if(p.error||!p.data||p.data.active!==true||!["owner","manager"].includes(p.data.role)){statusEl.textContent="Akses ditolak. Akaun owner/manager aktif diperlukan.";return null}statusEl.textContent="Log masuk sebagai "+(p.data.name||user.email)+" · "+p.data.role;return p.data}
async function reply(id){const box=document.getElementById("reply-"+id),reply=box.value.trim();if(!reply){alert("Tulis balasan dahulu.");return}const admin=await checkAdmin();if(!admin)return;const r=await db.from("website_feedback").update({admin_reply:reply,admin_replied_at:new Date().toISOString(),admin_replied_by:admin.name||"Admin"}).eq("id",id);if(r.error){alert("Gagal simpan balasan: "+r.error.message);return}await load()}
async function load(){list.innerHTML='<div class="card">Memuatkan maklum balas…</div>';const admin=await checkAdmin();if(!admin){list.innerHTML="";return}const r=await db.from("website_feedback").select("id,full_name,phone,rating,ease_of_use,reasons,explanation,created_at,admin_reply,admin_replied_at,admin_replied_by").order("created_at",{ascending:false}).limit(100);if(r.error){list.innerHTML='<div class="card">Tidak dapat membaca maklum balas: '+safe(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){list.innerHTML='<div class="card empty">Belum ada maklum balas.</div>';return}list.innerHTML=rows.map(x=>'<article class="feedback"><div class="stars">'+("★".repeat(Number(x.rating||0)))+("☆".repeat(Math.max(0,5-Number(x.rating||0))))+'</div><h3>'+safe(x.full_name)+'</h3><p class="muted">'+safe(x.created_at)+'</p><p><b>Pengalaman:</b> '+safe(x.ease_of_use||"-")+'</p>'+(x.reasons?.length?'<p><b>Sebab:</b> '+safe(x.reasons.join(", "))+'</p>':'')+(x.explanation?'<p><b>Maklum balas:</b><br>'+safe(x.explanation).replace(/\n/g,"<br>")+'</p>':'<p class="muted">Tiada komen.</p>')+(x.admin_reply?'<div class="reply"><b>↩️ Balasan Saujana Sejati Ent</b><p>'+safe(x.admin_reply).replace(/\n/g,"<br>")+'</p><small class="muted">'+safe(x.admin_replied_by||"Admin")+' · '+safe(x.admin_replied_at||"")+'</small></div>':'')+'<div class="reply"><b>💬 Balas maklum balas ini</b><textarea id="reply-'+Number(x.id)+'" placeholder="Contoh: Terima kasih atas maklum balas anda! Kami sangat menghargainya. ❤️">'+safe(x.admin_reply||"")+'</textarea><div class="actions"><button class="send" onclick="reply('+Number(x.id)+')">Hantar Balasan</button></div></div></article>').join("")}
load();</script></body></html>
